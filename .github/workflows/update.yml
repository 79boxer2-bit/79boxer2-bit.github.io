name: update-listings

on:
  schedule:
    - cron: '30 22,3,7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch listings from Naver
        run: python fetch_listings.py
      - name: Commit if changed
        run: |
          git config user.name "listing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add listings.json
          git diff --cached --quiet || git commit -m "listings update"
          git push
