name: update-listings

# 2026-09-30 사장님 요청으로 자동 실행 정지. 다시 켜려면 아래 두 줄의 # 을 지우세요.
on:
  # schedule:
  #   - cron: '30 22,3,7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch listings from Naver
        run: python fetch_listings.py
      - name: Commit if changed
        run: |
          git config user.name "listing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add listings.json
          git diff --cached --quiet || git commit -m "listings update"
          git push
