<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>AI 프롬프트 입력기</title>
<style>
:root{
  --sky:#1e88d2; --sky-dark:#155f95; --sky-light:#e8f4fc;
  --ink:#222; --gray:#767676; --line:#e5e8eb; --bg:#f7f9fb; --card:#fff;
  --ok:#2e7d32; --ok-bg:#e8f5e9; --warn:#c77700; --warn-bg:#fff4e0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#4aa8ea; --sky-dark:#8ccaf5; --sky-light:#16324a;
    --ink:#e8ecef; --gray:#9aa3ab; --line:#2c343b; --bg:#12171c; --card:#1a2128;
    --ok:#7ccf80; --ok-bg:#1d3320; --warn:#f0b35a; --warn-bg:#3a2c14; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --sky:#4aa8ea; --sky-dark:#8ccaf5; --sky-light:#16324a;
    --ink:#e8ecef; --gray:#9aa3ab; --line:#2c343b; --bg:#12171c; --card:#1a2128;
    --ok:#7ccf80; --ok-bg:#1d3320; --warn:#f0b35a; --warn-bg:#3a2c14; color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:14px}
header{background:linear-gradient(135deg,#12354e,#1e6ba8);color:#fff;padding-block:22px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto}
header h1{font-size:20px;font-weight:800;letter-spacing:-.4px}
header p{font-size:13px;opacity:.85;margin-top:4px}
.tabs{display:flex;gap:4px;margin-top:16px}
.tab{flex:1 1 0;min-width:0;border:0;border-radius:12px 12px 0 0;padding:12px 6px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;background:rgba(255,255,255,.14);color:#fff}
.tab.on{background:var(--bg);color:var(--sky-dark)}
.tab:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding-block:14px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.step{display:inline-flex;flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--sky);color:#fff;font-size:12px;align-items:center;justify-content:center}
label.f{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
label.f small{font-weight:400;color:var(--gray);margin-left:4px}
label.f .key{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:5px;padding:1px 5px;margin-left:4px}
textarea,input[type=text],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus,input:focus,select:focus{outline:2px solid var(--sky);outline-offset:-1px;background:var(--card)}
#q{min-height:84px;font-size:15px}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;font-weight:600;padding:7px 12px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--sky);border-color:var(--sky);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid2 .wide{grid-column:1 / -1}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg)}
.opt input{margin-top:3px;accent-color:var(--sky)}
details summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--sky-dark);margin-top:14px}
.meter{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sky);transition:.25s}
.meter b{font-size:13px;min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
.tips{list-style:none;display:flex;flex-direction:column;gap:5px}
.tips li{font-size:12.5px;padding:7px 10px;border-radius:8px;background:var(--warn-bg);color:var(--warn)}
.tips li.ok{background:var(--ok-bg);color:var(--ok)}
#out{min-height:280px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-block;text-align:center;text-decoration:none;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;background:var(--sky-light);color:var(--sky-dark)}
.btn.main{background:var(--sky);color:#fff;flex:1 1 0;min-width:0;padding-inline:8px}
.btn:active{transform:scale(.98)}
.hint{font-size:12px;color:var(--gray);margin-top:8px}
.hist{list-style:none;display:flex;flex-direction:column;gap:6px}
.hist li{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.hist li span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist li button{border:0;background:var(--sky-light);color:var(--sky-dark);border-radius:7px;padding:4px 9px;font-size:12px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:9;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>AI 프롬프트 입력기</h1>
  <p>필요한 칸만 채우면, AI가 가장 잘 알아듣는 질문으로 정리해 드립니다.</p>
  <nav class="tabs" id="tabs"></nav>
</div></header>

<main>
  <section class="card">
    <h2><span class="step">1</span>무엇을 할까요?</h2>
    <div class="chip-row" id="modes"></div>
    <label class="f" for="q" id="qLabel">요청</label>
    <textarea id="q"></textarea>
  </section>

  <section class="card">
    <h2><span class="step">2</span><span id="fieldsTitle">정보</span></h2>
    <div class="grid2" id="fields"></div>

    <label class="f" for="goal">어디에 쓰실 건가요? <small>목적</small></label>
    <input type="text" id="goal" placeholder="예) 임대인에게 보낼 안내 문자 / 매수 여부 판단 / 세무사 상담 전 정리">

    <div class="grid2">
      <div>
        <label class="f" for="fmt">원하는 결과 형태</label>
        <select id="fmt">
          <option value="">기본 (분야에 맞게)</option>
          <option value="summary">핵심만 짧게 요약</option>
          <option value="steps">단계별 실행 가이드</option>
          <option value="table">표로 비교</option>
          <option value="variants">여러 버전 제시</option>
          <option value="report">보고서 형식</option>
          <option value="checklist">체크리스트</option>
        </select>
      </div>
      <div>
        <label class="f" for="len">분량</label>
        <select id="len">
          <option value="">AI가 알아서</option>
          <option value="short">짧게 (5줄 안팎)</option>
          <option value="mid">보통</option>
          <option value="long">자세히</option>
        </select>
      </div>
    </div>

    <details>
      <summary>더 넣을 것 (참고자료, 피할 것, 내 소개)</summary>
      <label class="f" for="ref">참고자료 <small>기사, 계약서 문구, 표 등을 붙여넣기</small></label>
      <textarea id="ref" rows="4"></textarea>
      <label class="f" for="avoid">피해야 할 것</label>
      <input type="text" id="avoid" placeholder="예) 전문용어, 과장 표현, 영어 섞기">
      <label class="f" for="profile">내 소개 <small>이 기기에만 저장되고 세 탭 모두에 자동으로 들어갑니다</small></label>
      <textarea id="profile" rows="3" placeholder="예) 화성시 남양읍에서 17년째 공인중개사무소를 운영하고 있습니다."></textarea>
    </details>
  </section>

  <section class="card">
    <h2><span class="step">3</span>답변 규칙</h2>
    <div class="opts" id="opts"></div>
  </section>

  <section class="card">
    <h2><span class="step">4</span>완성된 프롬프트</h2>
    <div class="meter"><div class="bar"><i id="barFill"></i></div><b id="score">0점</b></div>
    <ul class="tips" id="tips"></ul>
    <label class="f" for="out">아래 내용은 직접 고쳐도 됩니다</label>
    <textarea id="out" spellcheck="false"></textarea>
    <div class="btns">
      <button class="btn main" id="copy">프롬프트 복사</button>
      <button class="btn" id="reset">이 작업 비우기</button>
    </div>
    <p class="hint">복사한 뒤 쓰시는 AI 입력칸에 붙여넣기(길게 누르기 또는 Ctrl+V) 하세요. 자동 복사가 안 되면 완성된 프롬프트 칸을 길게 눌러 전체 선택 후 복사하세요. 입력 내용은 서버로 전송되지 않고 이 기기에서만 처리됩니다.</p>
  </section>

  <section class="card" id="histCard" hidden>
    <h2>최근 프롬프트</h2>
    <ul class="hist" id="hist"></ul>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
// 탭(분야) → 작업(mode) → 전용 입력칸. key: true 인 칸은 결론을 좌우하는 핵심 정보
const TABS = {
  re: {
    label: '부동산 업무',
    modes: {
      lease: {
        label: '계약·임대차 질문',
        role: '17년 경력의 공인중개사이자 주택 임대차·매매 분쟁에 밝은 부동산 전문 변호사',
        qLabel: '궁금한 점', qPh: '예) 전세 잔금 치르고 입주 5일 만에 현관 도어락이 고장 났어요. 수리는 누가 해야 하나요?',
        opts: ['web', 'honest', 'sources', 'conclusion'],
        fields: [
          { id: 'stance', label: '내 입장', type: 'select', options: ['중개사', '임대인(집주인)', '임차인(세입자)', '매도인', '매수인'], key: true },
          { id: 'deal', label: '계약 종류', type: 'select', options: ['전세', '월세', '반전세', '매매', '기타'], key: true },
          { id: 'dates', label: '계약일·잔금일·입주일', ph: '예) 계약 9/1, 잔금·입주 10/15' },
          { id: 'special', label: '계약서 특약', ph: '예) 수리 관련 특약 없음', key: true },
          { id: 'issue', label: '문제 상황과 원인', type: 'textarea', wide: true, ph: '예) 비밀번호 눌러도 무반응, 배터리 교체해도 동일. 파손 흔적 없음', key: true },
          { id: 'checked', label: '입주 시 상태 확인', ph: '예) 잔금일에 정상 작동 확인함' },
          { id: 'cost', label: '비용·견적', ph: '예) 교체 견적 25만 원' }
        ],
        rules: [
          '민법(임대인의 수선의무 등), 주택임대차보호법, 관련 대법원 판례의 일반적 기준을 근거로 답하고, 근거 조문과 판례 취지를 함께 적어 주세요. 현행 규정은 웹검색으로 확인해 주세요.',
          '계약서 특약이 있으면 특약이 우선할 수 있으니, 특약 유무에 따라 결론이 어떻게 달라지는지 구분해 주세요.',
          '원인(노후·자연 고장 / 사용자 과실 / 소모품)이나 수리 규모에 따라 부담 주체가 달라지면 경우를 나눠 설명해 주세요.',
          '분쟁 소지가 큰 부분은 단정하지 말고, 대한법률구조공단·주택임대차분쟁조정위원회·변호사 상담이 필요하다고 명시해 주세요.'
        ],
        format: [
          '결론(누가 부담하는지) → 판단 기준과 근거 → 경우별 정리 → 지금 바로 할 일 순서로 정리해 주세요.',
          '질문자가 중개사라면 임대인·임차인에게 보낼 안내 문자 예시와, 다음 계약 때 넣을 특약 문구 예시도 덧붙여 주세요.'
        ]
      },
      ad: {
        label: '매물 광고문구',
        role: '네이버부동산·직방 매물 광고를 수천 건 써 본 부동산 마케팅 카피라이터',
        qLabel: '추가 요청', qPh: '비워 두면 "아래 매물 정보로 광고 문구를 써 주세요"로 들어갑니다',
        defaultQ: '아래 매물 정보로 광고 문구를 써 주세요.',
        opts: ['honest', 'variants'],
        fields: [
          { id: 'platform', label: '올릴 곳', type: 'select', options: ['네이버부동산', '직방', '다방', '블로그·카페', '여러 곳 공통'] },
          { id: 'deal', label: '거래 유형·가격', ph: '예) 매매 4억 2천 / 전세 2억 8천', key: true },
          { id: 'complex', label: '단지·평형', ph: '예) ○○아파트 32평(전용 84㎡)', key: true },
          { id: 'floor', label: '층·향·구조', ph: '예) 15층/20층, 남향, 판상형' },
          { id: 'move', label: '입주 가능일', ph: '예) 즉시 / 협의' },
          { id: 'merit', label: '장점', type: 'textarea', wide: true, ph: '예) 초등학교 도보 5분, 올수리, 확장, 시스템에어컨, 공원 조망', key: true }
        ],
        rules: [
          '공인중개사법 및 「중개대상물의 표시·광고 명시사항」을 지켜 주세요. 사실과 다르거나 과장된 표현(최저가, 급매 보장, 무조건 상승 등)은 쓰지 마세요.',
          '제공한 정보에 없는 사실(층수, 면적, 학군 거리 등)은 지어내지 말고, 필요하면 [확인 필요]로 표시해 주세요.'
        ],
        format: [
          '모바일 가독성 기준으로 한 줄 15~25자, 짧게 줄바꿈해 주세요.',
          '강조점을 달리한 5가지 버전(입지 / 조망 / 인테리어 / 특화공간 / 균형형)으로 제시해 주세요.',
          '각 버전마다 첫 줄은 시선을 끄는 헤드라인으로 해 주세요.'
        ]
      },
      blog: {
        label: '네이버 블로그',
        role: '네이버 검색 상위 노출 경험이 많은 부동산 블로그 콘텐츠 전문 작가',
        qLabel: '추가 요청', qPh: '비워 두면 "아래 내용으로 네이버 블로그 글을 써 주세요"로 들어갑니다',
        defaultQ: '아래 내용으로 네이버 블로그 글을 써 주세요.',
        opts: ['web', 'honest', 'selfcheck'],
        fields: [
          { id: 'topic', label: '글 주제', ph: '예) 남양읍 신축 아파트 전세 시세와 입주 체크포인트', key: true, wide: true },
          { id: 'keyword', label: '핵심 키워드', ph: '예) 남양읍 아파트 전세', key: true },
          { id: 'reader', label: '읽을 사람', ph: '예) 남양읍으로 이사 오려는 신혼부부' },
          { id: 'story', label: '직접 겪은 사례', type: 'textarea', wide: true, ph: '예) 지난달 상담한 신혼부부가 가장 많이 물어본 것', key: true },
          { id: 'photos', label: '올릴 사진 목록', type: 'textarea', wide: true, ph: '예) 단지 입구, 거실 남향 채광, 주변 초등학교' }
        ],
        rules: [
          '쓰기 전에 현재 시점의 네이버 검색 로직(C-Rank, D.I.A., AI 기반 검색 등)을 웹검색으로 확인하고 반영해 주세요. 과거 지식으로만 쓰지 마세요.',
          '17년 남양읍 현장 경력, KB부동산·한국부동산원 시세 제공 협력 중개사무소라는 전문성이 자연스럽게 드러나게 쓰고, 키워드를 억지로 반복하지 마세요.'
        ],
        format: [
          '분량은 공백 포함 2,800~4,000자로 해 주세요.',
          '사진이 들어갈 자리를 [사진: 설명] 형식으로 표시하고, 사진 설명 중심으로 구성해 주세요.',
          '제목 후보 3개, 본문, 추천 태그 10개 순서로 주세요.'
        ]
      },
      msg: {
        label: '고객 안내문자',

// 작업별로 입력값을 따로 보관: drafts['re.lease'] = { q, goal, fmt, len, ref, avoid, f: {...}, opts: {...} }
let tab = 're', mode = 'lease';
let modeOf = { re: 'lease', stock: 'trade', tax: 'inherit' };
let drafts = {};
const COMMON = ['q', 'goal', 'fmt', 'len', 'ref', 'avoid'];
const M = () => TABS[tab].modes[mode];
const dkey = () => tab + '.' + mode;

function draft() {
  if (!drafts[dkey()]) {
    const o = {};
    Object.keys(OPTS).forEach(k => o[k] = M().opts.includes(k) || k === 'tone');
    drafts[dkey()] = { f: {}, opts: o };
  }
  return drafts[dkey()];
}

function renderTabs() {
  $('tabs').innerHTML = '';
  Object.entries(TABS).forEach(([k, t]) => {
    const b = document.createElement('button');
    b.className = 'tab' + (k === tab ? ' on' : '');
    b.textContent = t.label;
    b.onclick = () => switchTo(k, modeOf[k]);
    $('tabs').appendChild(b);
  });
}

function renderModes() {
  $('modes').innerHTML = '';
  Object.entries(TABS[tab].modes).forEach(([k, m]) => {
    const b = document.createElement('button');
    b.className = 'chip' + (k === mode ? ' on' : '');
    b.textContent = m.label;
    b.onclick = () => switchTo(tab, k);
    $('modes').appendChild(b);
  });
}

function renderFields() {
  const d = draft();
  $('fields').innerHTML = '';
  $('fieldsTitle').textContent = M().label + ' 정보';
  M().fields.forEach(fd => {
    const box = document.createElement('div');
    if (fd.wide || fd.type === 'textarea') box.className = 'wide';
    const id = 'f_' + fd.id;
    const lab = document.createElement('label');
    lab.className = 'f'; lab.htmlFor = id; lab.textContent = fd.label;
    if (fd.key) { const k = document.createElement('span'); k.className = 'key'; k.textContent = '핵심'; lab.appendChild(k); }
    let el;
    if (fd.type === 'select') {
      el = document.createElement('select');
      ['', ...fd.options].forEach(o => {
        const op = document.createElement('option');
        op.value = o; op.textContent = o || '선택하세요';
        el.appendChild(op);
      });
    } else if (fd.type === 'textarea') {
      el = document.createElement('textarea'); el.rows = 3;
    } else {
      el = document.createElement('input'); el.type = 'text';
    }
    el.id = id;
    if (fd.ph) el.placeholder = fd.ph;
    el.value = d.f[fd.id] || '';
    el.addEventListener(fd.type === 'select' ? 'change' : 'input', () => { d.f[fd.id] = el.value; build(); });
    box.append(lab, el);
    $('fields').appendChild(box);
  });
}

function renderOpts() {
  const d = draft();
  $('opts').innerHTML = '';
  Object.entries(OPTS).forEach(([k, [label]]) => {
    const l = document.createElement('label');
    l.className = 'opt';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = !!d.opts[k];
    cb.onchange = () => { d.opts[k] = cb.checked; build(); };
    const s = document.createElement('span'); s.textContent = label;
    l.append(cb, s);
    $('opts').appendChild(l);
  });
}

function switchTo(t, m) {
  tab = t; mode = m; modeOf[t] = m;
  const d = draft();
  COMMON.forEach(f => $(f).value = d[f] || '');
  $('qLabel').textContent = M().qLabel;
  $('q').placeholder = M().qPh;
  renderTabs(); renderModes(); renderFields(); renderOpts(); build();
  try { history.replaceState(null, '', '#' + t); } catch (e) {}
}

function section(tag, body) {
  if (!body) return '';
  return `<${tag}>\n${body}\n</${tag}>\n\n`;
}
const bullets = arr => arr.map(s => '- ' + s).join('\n');

function build() {
  const m = M(), d = draft();
  COMMON.forEach(f => d[f] = $(f).value);
  const q = d.q.trim() || m.defaultQ || '';
  const profile = $('profile').value.trim();
  const goal = d.goal.trim();

  const bg = [];
  if (profile) bg.push('질문자 소개: ' + profile);
  if (goal) bg.push('이 답변의 용도: ' + goal);

  const filled = m.fields.filter(fd => (d.f[fd.id] || '').trim());
  const info = filled.map(fd => `${fd.label}: ${d.f[fd.id].trim()}`).join('\n');
  const missing = m.fields.filter(fd => fd.key && !(d.f[fd.id] || '').trim()).map(fd => fd.label);
  const missingText = missing.length
    ? '아래 정보가 없습니다. 결론을 크게 바꾸는 항목은 답하기 전에 먼저 물어보고, 나머지는 경우를 나눠 답해 주세요.\n' + bullets(missing)
    : '';

  const rules = [...m.rules];
  if (d.avoid.trim()) rules.push('다음은 피해 주세요: ' + d.avoid.trim());
  const format = [...m.format];
  if (d.fmt) format.push(FMT[d.fmt]);
  if (d.len) format.push(LEN[d.len]);
  const work = Object.keys(OPTS).filter(k => d.opts[k]).map(k => OPTS[k][1]);

  let p = `당신은 ${m.role}입니다. 아래 요청을 정확히 이해하고, 질문자가 바로 활용할 수 있는 최상의 답을 주세요.\n\n`;
  p += section('요청', q || '(여기에 질문이 들어갑니다)');
  p += section('배경', bg.join('\n'));
  p += section('정보', info);
  p += section('빠진 정보', missingText);
  p += section('참고자료', d.ref.trim());
  p += section('지켜야 할 조건', bullets(rules));
  p += section('답변 방식', bullets(work));
  p += section('출력 형식', bullets(format));
  $('out').value = p.trim();
  grade(m, d, q, goal, missing);
  store.set('pb3', { tab, modeOf, drafts });
  store.set('pb_profile', $('profile').value);
}

function grade(m, d, q, goal, missing) {
  const keys = m.fields.filter(fd => fd.key).length;
  const keyDone = keys - missing.length;
  const extra = m.fields.some(fd => !fd.key && (d.f[fd.id] || '').trim());
  const score = Math.round((keys ? keyDone / keys : 1) * 60 + (q.length >= 10 ? 15 : 0) + (goal ? 15 : 0) + (extra ? 10 : 0));
  $('barFill').style.width = score + '%';
  $('score').textContent = score + '점';
  const tips = [];
  if (q.length < 10) tips.push([false, '', '1번 칸에 궁금한 점을 한 문장 이상 적어 보세요']);
  missing.forEach(l => tips.push([false, '', `핵심 정보 '${l}'을(를) 채우면 답이 정확해져요`]));
  if (!goal) tips.push([false, '', '어디에 쓸지(목적)를 적으면 바로 쓸 수 있는 답이 나와요']);
  if (keys && !missing.length) tips.push([true, `핵심 정보 ${keys}개를 모두 채웠어요`]);
  if (goal) tips.push([true, '목적이 들어갔어요']);
  $('tips').innerHTML = '';
  tips.forEach(([ok, good, bad]) => {
    const li = document.createElement('li');
    if (ok) li.className = 'ok';
    li.textContent = ok ? '✓ ' + good : '+ ' + bad;
    $('tips').appendChild(li);
  });
}

function toast(msg) {
  $('toast').textContent = msg; $('toast').classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').classList.remove('show'), 2400);
}

function copyText() {
  const t = $('out').value;
  addHistory();
  const fallback = () => {
    $('out').focus(); $('out').select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    if (!ok) toast('자동 복사가 막혔어요. 선택된 글을 길게 눌러 복사해 주세요');
    return ok;
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(t).then(() => true, fallback);
  }
  return Promise.resolve(fallback());
}

function addHistory() {
  const d = draft();
  const title = d.q.trim() || Object.values(d.f).find(v => (v || '').trim()) || '';
  if (!title) return;
  const label = `${TABS[tab].label} · ${M().label}`;
  const h = store.get('pb_hist3', []).filter(x => !(x.title === title && x.label === label));
  h.unshift({ title, label, prompt: $('out').value, at: Date.now() });
  store.set('pb_hist3', h.slice(0, 20));
  renderHistory();
}

function renderHistory() {
  const h = store.get('pb_hist3', []);
  $('histCard').hidden = !h.length;
  $('hist').innerHTML = '';
  h.forEach(item => {
    const li = document.createElement('li');
    const s = document.createElement('span');
    s.textContent = `[${item.label}] ${item.title}`;
    const b = document.createElement('button');
    b.textContent = '불러오기';
    b.onclick = () => { $('out').value = item.prompt; $('out').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
    li.append(s, b);
    $('hist').appendChild(li);
  });
}

$('copy').onclick = () => copyText().then(ok => { if (ok) toast('복사했어요. AI 입력칸에 붙여넣기 하세요'); });
$('reset').onclick = () => {
  delete drafts[dkey()];
  switchTo(tab, mode);
  $('q').focus();
};
['q', 'goal', 'ref', 'avoid', 'profile'].forEach(f => $(f).addEventListener('input', build));
['fmt', 'len'].forEach(f => $(f).addEventListener('change', build));

(function init() {
  $('profile').value = store.get('pb_profile', '');
  const saved = store.get('pb3', null);
  if (saved && saved.drafts) {
    drafts = saved.drafts;
    Object.keys(TABS).forEach(t => {
      if (saved.modeOf && TABS[t].modes[saved.modeOf[t]]) modeOf[t] = saved.modeOf[t];
    });
    if (TABS[saved.tab]) tab = saved.tab;
  }
  const h = (location.hash || '').slice(1);
  if (TABS[h]) tab = h;
  switchTo(tab, modeOf[tab]);
  renderHistory();
})();
</script>
</body>
</html>
